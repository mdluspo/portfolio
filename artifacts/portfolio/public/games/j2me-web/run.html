<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freej2me-web</title>
</head>
<style>
    html, body {
        height: 100%;
        width: 100%;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: sans;
        background: #000;
        overflow: hidden;
        touch-action: none;
    }
    #screen-area {
        background-color: #000;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #display {
        background-color: white;
        zoom: 1;
        image-rendering: pixelated; /* affects zoom */
    }
    #display:focus {
        outline: none;
    }
    #loading {
        font-size: 2em;
        color: #fff;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0;
        text-align: center;
    }

    .keypad-part {
        background-color: transparent;
        padding: clamp(4px, 1.5vmin, 8px);
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        pointer-events: auto;
    }

    .key-grid {
        display: grid;
        gap: clamp(3px, 1.3vmin, 6px); /* Space between keys */
        width: 100%;
        height: 100%;
    }

    /* Grid definitions */
    .left-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
    }

    .right-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
    }

    /* Individual Key Styles */
    .key {
        background-color: rgb(0 0 0 / 0.34);
        color: #ffcf33;
        border: 2px solid rgb(255 207 51 / 0.82);
        border-radius: 8px;
        backdrop-filter: blur(2px);
        box-shadow:
            inset 0 0 0 1px rgb(0 0 0 / 0.3),
            0 4px 14px rgb(0 0 0 / 0.34);
        font-size: clamp(1rem, 4.8vmin, 1.5em); /* Larger text */
        font-weight: bold;
        cursor: pointer;
        display: flex;
        flex-direction: column; /* Allow stacking number/letters */
        align-items: center;
        justify-content: center;
        text-align: center;
        user-select: none; /* Prevent text selection on click/drag */
        transition: background-color 0.1s ease, transform 0.05s ease;
        line-height: 1.1;
    }
    .key span { /* Style for secondary text like ABC */
        font-size: 0.4em;
        font-weight: normal;
        margin-top: 2px;
        color: rgb(255 207 51 / 0.72);
    }

    .key.active {
        background-color: rgb(255 207 51 / 0.72);
        color: #000;
        transform: scale(0.95); /* Slight shrink effect on press */
    }

    .arrow-key {
        font-size: clamp(1.2rem, 6vmin, 2em); /* Make arrows bigger */
        position: relative;
        color: transparent;
    }

    .arrow-key::before {
        content: "";
        width: min(42%, 26px);
        height: min(42%, 26px);
        border-radius: 50%;
        background: rgb(255 207 51 / 0.86);
        box-shadow:
            inset -2px -2px 0 rgb(0 0 0 / 0.4),
            inset 2px 2px 0 rgb(255 255 255 / 0.55),
            0 2px 0 rgb(0 0 0 / 0.45);
    }

    .arrow-key::after {
        content: "";
        position: absolute;
        width: min(24%, 16px);
        height: min(28%, 18px);
        border-radius: 999px;
        background: rgb(0 0 0 / 0.78);
        transform-origin: 50% 100%;
    }

    .arrow-up::after {
        transform: translateY(-70%) rotate(0deg);
    }

    .arrow-left::after {
        transform: translateX(-70%) rotate(-90deg);
    }

    .arrow-right::after {
        transform: translateX(70%) rotate(90deg);
    }

    .arrow-down::after {
        transform: translateY(70%) rotate(180deg);
    }

    .ok-key {
        font-size: clamp(1rem, 4.2vmin, 1.3em);
    }

    /* Styles for specifically smaller keys */
    .small-key {
        /* Instead of scaling the whole button, we control its size within the grid cell */
        width: 70%;
        height: 70%;
        font-size: 0.9em;
        align-self: end;   /* Center vertically in grid cell */
        /* Ensure padding/border don't make it too big */
        padding: 2px;
        line-height: 1;
    }

    .small-key-left {
        justify-self: left;
    }

    .small-key-right {
        justify-self: right;
    }


    #left-keys,
    #right-keys {
        display: none;
        position: absolute;
        bottom: max(8px, env(safe-area-inset-bottom));
        z-index: 5;
    }

    #left-keys {
        left: 0;
    }

    #right-keys {
        right: 0;
    }

    #screen-area {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    body.kbd-portrait #left-keys,
    body.kbd-portrait #right-keys,
    body.kbd-landscape #left-keys,
    body.kbd-landscape #right-keys {
        display: flex;
    }

    body.kbd-portrait #left-keys {
        left: max(8px, env(safe-area-inset-left));
        width: clamp(124px, 36dvw, 164px);
        height: clamp(124px, 18dvh, 164px);
    }

    body.kbd-portrait #right-keys {
        right: max(8px, env(safe-area-inset-right));
        width: clamp(108px, 31dvw, 142px);
        height: clamp(104px, 15dvh, 136px);
    }

    body.kbd-landscape #left-keys,
    body.kbd-landscape #right-keys {
        width: clamp(116px, 19dvw, 156px);
        height: clamp(150px, 72dvh, 240px);
        bottom: max(8px, env(safe-area-inset-bottom));
        top: auto;
    }

    /* max height in landscape mode */
    body.kbd-landscape #left-keys .key-grid,
    body.kbd-landscape #right-keys .key-grid {
        max-height: 400px;
    }

    body.kbd-landscape #screen-area {
        left: 0;
        right: 0;
    }

    @media (max-width: 380px) {
        .key span {
            display: none;
        }

        .small-key {
            width: 82%;
            height: 82%;
        }
    }

</style>
<body>
    <div id="screen-area">
        <canvas tabindex="0" id="display" style="display: none;"></canvas>
        <div id="loading">Loading...</div>
    </div>
    <div id="left-keys" class="keypad-part">
        <div class="key-grid left-grid">
            <span></span>
            <button data-key="ArrowUp" class="key arrow-key arrow-up" aria-label="Up">Up</button>
            <span></span>
            <button data-key="ArrowLeft" class="key arrow-key arrow-left" aria-label="Left">Left</button>
            <span></span>
            <button data-key="ArrowRight" class="key arrow-key arrow-right" aria-label="Right">Right</button>
            <span></span>
            <button data-key="ArrowDown" class="key arrow-key arrow-down" aria-label="Down">Down</button>
            <span></span>
        </div>
    </div>
    <div id="right-keys" class="keypad-part">
         <div class="key-grid right-grid">
            <button data-key="F1" class="key">L</button>
            <button data-key="F2" class="key">R</button>
            <button data-key="Digit5" class="key ok-key">5</button>
            <button data-key="Enter" class="key ok-key">OK</button>
        </div>
    </div>
    <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
    <script type="module" src="src/main.js?v=13"></script>
</body>
</html>
