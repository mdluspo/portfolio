<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM II</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        color: #ffcf33;
        font-family: Arial, sans-serif;
      }

      body {
        display: block;
        touch-action: none;
      }

      #canvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
        outline: none;
        background: #000;
      }

      .mobile-controls,
      .rotate-hint,
      .focus-menu {
        display: none;
      }

      .mobile-controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .joystick {
        position: absolute;
        width: 118px;
        height: 118px;
        border: 2px solid rgba(215, 238, 255, 0.82);
        border-radius: 999px;
        background: rgba(3, 10, 18, 0.18);
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.48), inset 0 0 24px rgba(215, 238, 255, 0.13);
        pointer-events: auto;
        touch-action: none;
      }

      .move-stick {
        left: max(18px, env(safe-area-inset-left));
        bottom: max(72px, calc(env(safe-area-inset-bottom) + 72px));
      }

      .aim-stick {
        right: max(20px, env(safe-area-inset-right));
        bottom: max(82px, calc(env(safe-area-inset-bottom) + 82px));
      }

      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        border: 2px solid rgba(215, 238, 255, 0.8);
        border-radius: 999px;
        background: rgba(215, 238, 255, 0.58);
        box-shadow: 0 0 12px rgba(215, 238, 255, 0.28);
        transform: translate(-50%, -50%);
      }

      .top-left-actions {
        position: absolute;
        left: max(10px, env(safe-area-inset-left));
        top: max(10px, env(safe-area-inset-top));
        display: flex;
        gap: 6px;
        pointer-events: auto;
      }

      .left-side-actions {
        position: absolute;
        left: max(96px, calc(env(safe-area-inset-left) + 96px));
        top: 27%;
        display: grid;
        gap: 10px;
        pointer-events: auto;
      }

      .right-side-actions {
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        top: 24%;
        display: grid;
        gap: 14px;
        pointer-events: auto;
      }

      .action-pad {
        position: absolute;
        right: max(154px, calc(env(safe-area-inset-right) + 154px));
        bottom: max(116px, calc(env(safe-area-inset-bottom) + 116px));
        display: grid;
        grid-template-columns: 62px;
        grid-template-rows: 62px;
        align-items: center;
        justify-items: center;
        pointer-events: auto;
      }

      .mobile-controls button {
        width: 46px;
        height: 46px;
        border: 2px solid rgba(215, 238, 255, 0.82);
        border-radius: 999px;
        background: rgba(7, 17, 30, 0.28);
        color: rgba(245, 251, 255, 0.94);
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.34), inset 0 0 16px rgba(215, 238, 255, 0.12);
        backdrop-filter: blur(2px);
        font: 900 8px Arial, sans-serif;
        letter-spacing: 0;
        text-transform: uppercase;
        touch-action: none;
        display: grid;
        place-items: center;
        gap: 1px;
      }

      .action-pad .primary-action {
        grid-column: 1;
        grid-row: 1;
        width: 62px;
        height: 62px;
        border-radius: 999px;
        background: rgba(255, 207, 51, 0.28);
        border-color: rgba(255, 228, 112, 0.92);
        font-size: 11px;
      }

      .crosshair-action {
        position: absolute;
        right: max(140px, calc(env(safe-area-inset-right) + 140px));
        top: 31%;
        pointer-events: auto;
      }

      .action-icon {
        font-size: 18px;
        line-height: 1;
      }

      .primary-action .action-icon {
        font-size: 24px;
      }

      .bullet-icon {
        position: relative;
        width: 28px;
        height: 14px;
        transform: rotate(-18deg);
      }

      .bullet-icon::before,
      .bullet-icon::after {
        content: "";
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: block;
      }

      .bullet-icon::before {
        right: 0;
        width: 21px;
        height: 10px;
        border: 2px solid rgba(5, 5, 5, 0.88);
        border-left-width: 6px;
        border-radius: 999px 5px 5px 999px;
        background: #ffcf33;
      }

      .bullet-icon::after {
        left: 0;
        width: 12px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 244, 181, 0.9);
        box-shadow: -6px 0 0 rgba(255, 244, 181, 0.42);
      }

      .action-label {
        font-size: 8px;
        line-height: 1;
      }

      .mobile-controls button:active,
      .mobile-controls button.is-held {
        background: rgba(215, 238, 255, 0.42);
        transform: scale(0.95);
      }

      .menu-pad,
      .menu-select {
        display: none;
      }

      body.menu-mode .game-action {
        display: none;
      }

      body.menu-mode .action-pad {
        display: none;
      }

      body.menu-mode .move-stick {
        display: none;
      }

      body.menu-mode .menu-pad {
        position: absolute;
        right: max(24px, env(safe-area-inset-right));
        top: 50%;
        display: grid;
        grid-template-columns: 62px;
        grid-template-rows: repeat(3, 50px);
        gap: 9px;
        transform: translateY(-50%);
        pointer-events: auto;
      }

      body.menu-mode .menu-pad button {
        width: 62px;
        height: 50px;
        border-radius: 12px;
      }

      .top-mobile-menu {
        position: absolute;
        right: max(10px, env(safe-area-inset-right));
        top: max(10px, env(safe-area-inset-top));
        font-size: 18px;
        pointer-events: auto;
      }

      .top-left-actions button {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        font-size: 10px;
      }

      .focus-menu {
        position: fixed;
        inset: 0;
        z-index: 30;
        place-items: center;
        padding: 24px;
        background: rgba(5, 5, 5, 0.72);
        color: #ffcf33;
        text-align: center;
        font: 900 18px Arial, sans-serif;
        text-transform: uppercase;
      }

      .focus-menu.is-visible {
        display: grid;
      }

      .focus-menu button {
        margin-top: 18px;
        border: 3px solid #000;
        border-radius: 10px;
        background: #ffcf33;
        color: #050505;
        box-shadow: 4px 4px 0 #000;
        padding: 12px 18px;
        font: 900 13px Arial, sans-serif;
        text-transform: uppercase;
      }

      #status {
        display: none;
        min-height: 0;
        padding: 9px 12px;
        border-top: 2px solid #000;
        background: #2c2c2c;
        color: #ffcf33;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      @media (pointer: coarse) {
        .mobile-controls {
          display: block;
        }

        #canvas {
          height: 100dvh;
        }
      }

      @media (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
        .joystick {
          width: 108px;
          height: 108px;
        }

        .move-stick {
          left: max(18px, env(safe-area-inset-left));
          bottom: max(58px, calc(env(safe-area-inset-bottom) + 58px));
        }

        .aim-stick {
          right: max(20px, env(safe-area-inset-right));
          bottom: max(62px, calc(env(safe-area-inset-bottom) + 62px));
        }

        .joystick-knob {
          width: 40px;
          height: 40px;
        }

        .right-side-actions {
          right: max(14px, env(safe-area-inset-right));
          top: 18%;
          gap: 12px;
        }

        .action-pad {
          right: max(142px, calc(env(safe-area-inset-right) + 142px));
          bottom: max(86px, calc(env(safe-area-inset-bottom) + 86px));
        }

        .crosshair-action {
          right: max(132px, calc(env(safe-area-inset-right) + 132px));
          top: 31%;
        }
      }

      @media (pointer: coarse) and (orientation: portrait) {
        .rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #050505;
          color: #ffcf33;
          text-align: center;
          font: 900 18px Arial, sans-serif;
          text-transform: uppercase;
        }
      }
    </style>
  </head>
  <body class="menu-mode">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading DOOM...</div>
    <div class="mobile-controls" aria-label="DOOM mobile controls">
      <div class="top-left-actions">
        <button type="button" class="game-action" data-control-mode="menu" data-doom-key="Escape" data-doom-code="Escape" data-doom-keycode="27" aria-label="Escape">ESC</button>
        <button type="button" class="game-action" data-doom-key="Tab" data-doom-code="Tab" data-doom-keycode="9" aria-label="Map">MAP</button>
      </div>
      <div class="joystick move-stick" data-stick="move" aria-label="Move">
        <div class="joystick-knob"></div>
      </div>
      <div class="joystick aim-stick game-action" data-stick="aim" data-tap-fire="true" aria-label="Aim joystick. Tap to fire.">
        <div class="joystick-knob"></div>
      </div>
      <div class="menu-pad" aria-label="Menu navigation">
        <button type="button" data-menu-step="true" data-doom-key="ArrowUp" data-doom-code="ArrowUp" data-doom-keycode="38" aria-label="Menu up">&#8593;</button>
        <button type="button" class="menu-select" data-menu-select="true" data-doom-key="Enter" data-doom-code="Enter" data-doom-keycode="13">Enter</button>
        <button type="button" data-menu-step="true" data-doom-key="ArrowDown" data-doom-code="ArrowDown" data-doom-keycode="40" aria-label="Menu down">&#8595;</button>
      </div>
      <button type="button" class="top-mobile-menu game-action" data-control-mode="menu" data-doom-key="Escape" data-doom-code="Escape" data-doom-keycode="27" aria-label="Menu">&#9776;</button>
      <button type="button" class="crosshair-action game-action" data-doom-key="Shift" data-doom-code="ShiftLeft" data-doom-keycode="16" aria-label="Run"><span class="action-icon">&#8853;</span></button>
      <div class="left-side-actions">
        <button type="button" class="game-action use-action" data-doom-key="e" data-doom-code="KeyE" data-doom-keycode="69" aria-label="Use"><span class="action-icon">&#9995;</span></button>
        <button type="button" class="game-action swap-action" data-weapon-cycle="true" aria-label="Swap weapon"><span class="action-icon">&#8644;</span></button>
      </div>
      <div class="right-side-actions">
        <button type="button" class="game-action reload-action" data-doom-key="r" data-doom-code="KeyR" data-doom-keycode="82" aria-label="Reload"><span class="action-icon">&#8635;</span></button>
        <button type="button" class="game-action run-action" data-doom-key="Shift" data-doom-code="ShiftLeft" data-doom-keycode="16" aria-label="Run"><span class="action-icon">&#8593;</span></button>
      </div>
      <div class="action-pad">
        <button type="button" class="primary-action game-action" data-doom-key=" " data-doom-code="Space" data-doom-keycode="32" aria-label="Fire"><span class="action-icon bullet-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="focus-menu" id="focus-menu">
      <div>
        <div>DOOM is paused</div>
        <button type="button" id="resume-game">Tap to resume</button>
      </div>
    </div>
    <div class="rotate-hint">Rotate your phone sideways for the best DOOM controls.</div>
    <script src="/games/doom/doom-loader.js?v=17"></script>
  </body>
</html>
