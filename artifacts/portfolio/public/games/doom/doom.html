<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM II</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        color: #ffcf33;
        font-family: Arial, sans-serif;
      }

      body {
        display: block;
        touch-action: none;
      }

      #canvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
        outline: none;
        background: #000;
      }

      #status {
        display: none;
        min-height: 0;
        padding: 9px 12px;
        border-top: 2px solid #000;
        background: #2c2c2c;
        color: #ffcf33;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      #touch-controls {
        position: fixed;
        inset: auto 0 0;
        z-index: 3;
        display: none;
        grid-template-columns: minmax(132px, 36vw) 1fr minmax(132px, 36vw);
        gap: 10px;
        padding: 10px;
        pointer-events: none;
      }

      .touch-pad,
      .touch-actions {
        display: grid;
        gap: 6px;
        pointer-events: auto;
      }

      .touch-pad {
        grid-template-columns: repeat(3, minmax(38px, 1fr));
        grid-template-rows: repeat(3, 42px);
      }

      .touch-actions {
        align-self: end;
        grid-template-columns: repeat(2, minmax(54px, 1fr));
      }

      .touch-key {
        border: 2px solid #ffcf33;
        border-radius: 8px;
        background: rgb(0 0 0 / 0.64);
        color: #ffcf33;
        font: 900 clamp(11px, 3.6vw, 14px) Arial, sans-serif;
        text-transform: uppercase;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-key:active,
      .touch-key.is-pressed {
        background: #ffcf33;
        color: #000;
      }

      .touch-up {
        grid-column: 2;
      }

      .touch-left {
        grid-column: 1;
        grid-row: 2;
      }

      .touch-right {
        grid-column: 3;
        grid-row: 2;
      }

      .touch-down {
        grid-column: 2;
        grid-row: 3;
      }

      @media (pointer: coarse), (max-width: 820px) {
        #canvas {
          height: calc(100% - 142px);
        }

        #touch-controls {
          display: grid;
        }
      }

      @media (orientation: landscape) and (max-height: 520px) {
        #canvas {
          width: calc(100% - 276px);
          height: 100%;
          margin-left: 138px;
        }

        #touch-controls {
          top: 0;
          bottom: 0;
          grid-template-columns: 128px 1fr 128px;
          align-items: end;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="touch-controls" aria-label="DOOM touch controls">
      <div class="touch-pad">
        <button class="touch-key touch-up" data-doom-key="ArrowUp" type="button">Up</button>
        <button class="touch-key touch-left" data-doom-key="ArrowLeft" type="button">Left</button>
        <button class="touch-key touch-right" data-doom-key="ArrowRight" type="button">Right</button>
        <button class="touch-key touch-down" data-doom-key="ArrowDown" type="button">Down</button>
      </div>
      <div></div>
      <div class="touch-actions">
        <button class="touch-key" data-doom-key="Control" type="button">Fire</button>
        <button class="touch-key" data-doom-key="Space" type="button">Use</button>
        <button class="touch-key" data-doom-key="Shift" type="button">Run</button>
        <button class="touch-key" data-doom-key="Escape" type="button">Menu</button>
      </div>
    </div>
    <div id="status">Loading DOOM...</div>
    <script src="/games/doom/doom-loader.js"></script>
  </body>
</html>
