<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM II</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: #050505;
        color: #ffcf33;
        font-family: Arial, sans-serif;
      }

      body {
        display: block;
        touch-action: none;
      }

      #canvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
        outline: none;
        background: #000;
      }

      #status {
        display: none;
        min-height: 0;
        padding: 9px 12px;
        border-top: 2px solid #000;
        background: #2c2c2c;
        color: #ffcf33;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      #touch-controls {
        position: fixed;
        inset: auto 0 0;
        z-index: 3;
        display: none;
        grid-template-columns: minmax(112px, 28vw) 1fr minmax(126px, 34vw);
        gap: 10px;
        padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
        pointer-events: none;
      }

      .touch-actions {
        display: grid;
        gap: 6px;
        pointer-events: auto;
      }

      .touch-joystick {
        --stick-x: 0px;
        --stick-y: 0px;
        position: relative;
        align-self: end;
        width: clamp(92px, 24vw, 124px);
        aspect-ratio: 1;
        border: 2px solid rgb(255 207 51 / 0.72);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 50%, rgb(255 207 51 / 0.24), rgb(0 0 0 / 0.18) 56%, rgb(0 0 0 / 0.34));
        box-shadow:
          inset 0 0 0 2px rgb(0 0 0 / 0.32),
          0 4px 14px rgb(0 0 0 / 0.38);
        pointer-events: auto;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-joystick::before,
      .touch-joystick::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        pointer-events: none;
      }

      .touch-joystick::before {
        width: 68%;
        height: 2px;
        background: rgb(255 207 51 / 0.34);
        transform: translate(-50%, -50%);
      }

      .touch-joystick::after {
        width: 38%;
        aspect-ratio: 1;
        border: 2px solid rgb(255 207 51 / 0.88);
        border-radius: 999px;
        background: rgb(255 207 51 / 0.32);
        box-shadow: inset -2px -2px 0 rgb(0 0 0 / 0.38), inset 2px 2px 0 rgb(255 255 255 / 0.18);
        transform: translate(calc(-50% + var(--stick-x)), calc(-50% + var(--stick-y)));
      }

      .touch-joystick.is-active {
        background:
          radial-gradient(circle at 50% 50%, rgb(255 207 51 / 0.34), rgb(0 0 0 / 0.18) 56%, rgb(0 0 0 / 0.34));
      }

      .touch-actions {
        align-self: end;
        grid-template-columns: repeat(2, minmax(54px, 1fr));
      }

      .touch-key {
        border: 2px solid #ffcf33;
        border-radius: 8px;
        background: rgb(0 0 0 / 0.34);
        backdrop-filter: blur(2px);
        color: #ffcf33;
        font: 900 clamp(11px, 3.6vw, 14px) Arial, sans-serif;
        text-transform: uppercase;
        -webkit-tap-highlight-color: transparent;
      }

      .touch-key:active,
      .touch-key.is-pressed {
        background: rgb(255 207 51 / 0.72);
        color: #000;
      }

      @media (pointer: coarse), (max-width: 820px) {
        #touch-controls {
          display: grid;
        }
      }

      @media (orientation: landscape) and (max-height: 520px) {
        #touch-controls {
          top: 0;
          bottom: 0;
          grid-template-columns: 112px 1fr 126px;
          align-items: end;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="touch-controls" aria-label="DOOM touch controls">
      <div class="touch-joystick" data-doom-joystick role="application" aria-label="Move"></div>
      <div></div>
      <div class="touch-actions">
        <button class="touch-key" data-doom-key="Control" type="button">Fire</button>
        <button class="touch-key" data-doom-keys="Space,Enter" type="button">Use</button>
        <button class="touch-key" data-doom-key="Shift" type="button">Run</button>
        <button class="touch-key" data-doom-key="Escape" type="button">Menu</button>
      </div>
    </div>
    <div id="status">Loading DOOM...</div>
    <script src="/games/doom/doom-loader.js"></script>
  </body>
</html>
