<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM II</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        color: #ffcf33;
        font-family: Arial, sans-serif;
      }

      body {
        display: block;
        touch-action: none;
      }

      #canvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
        outline: none;
        background: #000;
      }

      .mobile-controls,
      .rotate-hint,
      .focus-menu {
        display: none;
      }

      .mobile-controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .joystick {
        position: absolute;
        width: 128px;
        height: 128px;
        border: 3px solid rgba(255, 207, 51, 0.78);
        border-radius: 999px;
        background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.13), rgba(5, 5, 5, 0.44) 58%);
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.72), inset 0 0 24px rgba(255, 207, 51, 0.12);
        pointer-events: auto;
        touch-action: none;
      }

      .move-stick {
        left: max(18px, env(safe-area-inset-left));
        bottom: max(20px, env(safe-area-inset-bottom));
      }

      .aim-stick {
        right: max(116px, calc(env(safe-area-inset-right) + 116px));
        bottom: max(84px, calc(env(safe-area-inset-bottom) + 84px));
        width: 118px;
        height: 118px;
      }

      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border: 3px solid #000;
        border-radius: 999px;
        background: #ffcf33;
        box-shadow: 4px 4px 0 #000;
        transform: translate(-50%, -50%);
      }

      .action-pad {
        position: absolute;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(2, 66px);
        gap: 9px;
        pointer-events: auto;
      }

      .action-pad button {
        height: 54px;
        border: 3px solid #000;
        border-radius: 999px;
        background: rgba(255, 207, 51, 0.9);
        color: #050505;
        box-shadow: 4px 4px 0 #000;
        font: 900 11px Arial, sans-serif;
        letter-spacing: 0;
        text-transform: uppercase;
        touch-action: none;
      }

      .action-pad .primary-action {
        grid-row: span 2;
        height: 117px;
        background: #ffcf33;
        font-size: 13px;
      }

      .action-pad button:active,
      .action-pad button.is-held {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 #000;
      }

      .menu-select {
        display: none;
      }

      body.menu-mode .aim-stick,
      body.menu-mode .game-action {
        display: none;
      }

      body.menu-mode .menu-select {
        display: block;
        width: 84px;
        height: 84px;
      }

      body.menu-mode .action-pad {
        grid-template-columns: 84px;
        right: max(28px, env(safe-area-inset-right));
        bottom: max(42px, env(safe-area-inset-bottom));
      }

      .focus-menu {
        position: fixed;
        inset: 0;
        z-index: 30;
        place-items: center;
        padding: 24px;
        background: rgba(5, 5, 5, 0.72);
        color: #ffcf33;
        text-align: center;
        font: 900 18px Arial, sans-serif;
        text-transform: uppercase;
      }

      .focus-menu.is-visible {
        display: grid;
      }

      .focus-menu button {
        margin-top: 18px;
        border: 3px solid #000;
        border-radius: 10px;
        background: #ffcf33;
        color: #050505;
        box-shadow: 4px 4px 0 #000;
        padding: 12px 18px;
        font: 900 13px Arial, sans-serif;
        text-transform: uppercase;
      }

      #status {
        display: none;
        min-height: 0;
        padding: 9px 12px;
        border-top: 2px solid #000;
        background: #2c2c2c;
        color: #ffcf33;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      @media (pointer: coarse) {
        .mobile-controls {
          display: block;
        }

        #canvas {
          height: 100dvh;
        }
      }

      @media (pointer: coarse) and (orientation: portrait) {
        .rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #050505;
          color: #ffcf33;
          text-align: center;
          font: 900 18px Arial, sans-serif;
          text-transform: uppercase;
        }
      }
    </style>
  </head>
  <body class="menu-mode">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading DOOM...</div>
    <div class="mobile-controls" aria-label="DOOM mobile controls">
      <div class="joystick move-stick" data-stick="move" aria-label="Move">
        <div class="joystick-knob"></div>
      </div>
      <div class="joystick aim-stick" data-stick="aim" aria-label="Aim">
        <div class="joystick-knob"></div>
      </div>
      <div class="action-pad">
        <button type="button" class="menu-select" data-control-mode="game" data-doom-key=" " data-doom-code="Space" data-doom-keycode="32">Select</button>
        <button type="button" class="primary-action game-action" data-control-mode="game" data-doom-key=" " data-doom-code="Space" data-doom-keycode="32">Fire</button>
        <button type="button" class="game-action" data-control-mode="game" data-doom-key="e" data-doom-code="KeyE" data-doom-keycode="69">Use</button>
        <button type="button" class="game-action" data-control-mode="game" data-doom-key="Shift" data-doom-code="ShiftLeft" data-doom-keycode="16">Run</button>
        <button type="button" class="game-action" data-control-mode="menu" data-doom-key="Escape" data-doom-code="Escape" data-doom-keycode="27">Menu</button>
      </div>
    </div>
    <div class="focus-menu" id="focus-menu">
      <div>
        <div>DOOM is paused</div>
        <button type="button" id="resume-game">Tap to resume</button>
      </div>
    </div>
    <div class="rotate-hint">Rotate your phone sideways for the best DOOM controls.</div>
    <script src="/games/doom/doom-loader.js?v=11"></script>
  </body>
</html>
