<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM II</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        color: #ffcf33;
        font-family: Arial, sans-serif;
      }

      body {
        display: block;
        touch-action: none;
      }

      #canvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
        outline: none;
        background: #000;
      }

      .mobile-controls,
      .rotate-hint,
      .focus-menu {
        display: none;
      }

      .mobile-controls {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .joystick {
        position: absolute;
        width: 138px;
        height: 138px;
        border: 2px solid rgba(215, 238, 255, 0.82);
        border-radius: 999px;
        background: rgba(3, 10, 18, 0.18);
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.48), inset 0 0 24px rgba(215, 238, 255, 0.13);
        pointer-events: auto;
        touch-action: none;
      }

      .move-stick {
        left: max(34px, calc(env(safe-area-inset-left) + 26px));
        top: 29%;
      }

      .aim-stick {
        right: max(34px, calc(env(safe-area-inset-right) + 26px));
        top: 24%;
      }

      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border: 2px solid rgba(215, 238, 255, 0.8);
        border-radius: 999px;
        background: rgba(215, 238, 255, 0.58);
        box-shadow: 0 0 12px rgba(215, 238, 255, 0.28);
        transform: translate(-50%, -50%);
      }

      .top-left-actions {
        position: absolute;
        left: max(20px, calc(env(safe-area-inset-left) + 14px));
        top: max(16px, calc(env(safe-area-inset-top) + 12px));
        display: flex;
        gap: 8px;
        pointer-events: auto;
      }

      .move-dpad {
        position: absolute;
        left: max(38px, calc(env(safe-area-inset-left) + 30px));
        bottom: max(26px, calc(env(safe-area-inset-bottom) + 24px));
        width: 126px;
        height: 126px;
        pointer-events: auto;
      }

      .top-right-actions {
        position: absolute;
        right: max(20px, calc(env(safe-area-inset-right) + 14px));
        top: max(16px, calc(env(safe-area-inset-top) + 12px));
        display: flex;
        align-items: flex-start;
        gap: 12px;
        pointer-events: auto;
      }

      .action-pad {
        position: absolute;
        right: max(38px, calc(env(safe-area-inset-right) + 30px));
        bottom: max(26px, calc(env(safe-area-inset-bottom) + 24px));
        display: grid;
        grid-template-columns: 84px;
        grid-template-rows: 84px;
        align-items: center;
        justify-items: center;
        pointer-events: auto;
      }

      .mobile-controls button {
        width: 54px;
        height: 54px;
        border: 2px solid rgba(215, 238, 255, 0.82);
        border-radius: 999px;
        background: rgba(7, 17, 30, 0.28);
        color: rgba(245, 251, 255, 0.94);
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.34), inset 0 0 16px rgba(215, 238, 255, 0.12);
        backdrop-filter: blur(2px);
        font: 900 10px Arial, sans-serif;
        letter-spacing: 0;
        text-transform: uppercase;
        touch-action: none;
        display: grid;
        place-items: center;
        gap: 1px;
      }

      .action-pad .primary-action {
        grid-column: 1;
        grid-row: 1;
        width: 84px;
        height: 84px;
        border-radius: 999px;
        background: rgba(255, 207, 51, 0.28);
        border-color: rgba(255, 228, 112, 0.92);
        font-size: 11px;
      }

      .top-mobile-menu {
        font-size: 18px;
      }

      .open-action {
        width: 68px;
        border-radius: 10px;
        font-size: 13px;
      }

      .run-action,
      .weapon-action {
        width: 58px;
        border-radius: 10px;
        font-size: 11px;
      }

      .move-dpad button {
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 8px;
        font-size: 20px;
      }

      .move-dpad .dpad-up {
        left: 38px;
        top: 0;
      }

      .move-dpad .dpad-left {
        left: 0;
        top: 38px;
      }

      .move-dpad .dpad-right {
        right: 0;
        top: 38px;
      }

      .move-dpad .dpad-down {
        left: 38px;
        bottom: 0;
      }

      .action-icon {
        font-size: 18px;
        line-height: 1;
      }

      .primary-action .action-icon {
        font-size: 24px;
      }

      .bullet-icon {
        position: relative;
        width: 28px;
        height: 14px;
        transform: rotate(-18deg);
      }

      .bullet-icon::before,
      .bullet-icon::after {
        content: "";
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        display: block;
      }

      .bullet-icon::before {
        right: 0;
        width: 21px;
        height: 10px;
        border: 2px solid rgba(5, 5, 5, 0.88);
        border-left-width: 6px;
        border-radius: 999px 5px 5px 999px;
        background: #ffcf33;
      }

      .bullet-icon::after {
        left: 0;
        width: 12px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 244, 181, 0.9);
        box-shadow: -6px 0 0 rgba(255, 244, 181, 0.42);
      }

      .action-label {
        font-size: 8px;
        line-height: 1;
      }

      .mobile-controls button:active,
      .mobile-controls button.is-held {
        background: rgba(215, 238, 255, 0.42);
        transform: scale(0.95);
      }

      .menu-pad,
      .menu-select {
        display: none;
      }

      body.menu-mode .game-action {
        display: none;
      }

      body.menu-mode .action-pad {
        display: none;
      }

      body.menu-mode .move-stick {
        display: none;
      }

      body.menu-mode .menu-pad {
        position: absolute;
        right: max(36px, calc(env(safe-area-inset-right) + 28px));
        top: 50%;
        display: grid;
        grid-template-columns: 78px;
        grid-template-rows: repeat(3, 58px);
        gap: 10px;
        transform: translateY(-50%);
        pointer-events: auto;
      }

      body.menu-mode .menu-select {
        display: grid;
      }

      body.menu-mode .menu-pad button {
        width: 78px;
        height: 58px;
        border-radius: 12px;
      }

      .top-left-actions button {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        font-size: 10px;
      }

      .focus-menu {
        position: fixed;
        inset: 0;
        z-index: 30;
        place-items: center;
        padding: 24px;
        background: rgba(5, 5, 5, 0.72);
        color: #ffcf33;
        text-align: center;
        font: 900 18px Arial, sans-serif;
        text-transform: uppercase;
      }

      .focus-menu.is-visible {
        display: grid;
      }

      .focus-menu button {
        margin-top: 18px;
        border: 3px solid #000;
        border-radius: 10px;
        background: #ffcf33;
        color: #050505;
        box-shadow: 4px 4px 0 #000;
        padding: 12px 18px;
        font: 900 13px Arial, sans-serif;
        text-transform: uppercase;
      }

      #status {
        display: none;
        min-height: 0;
        padding: 9px 12px;
        border-top: 2px solid #000;
        background: #2c2c2c;
        color: #ffcf33;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }

      @media (pointer: coarse) {
        .mobile-controls {
          display: block;
        }

        #canvas {
          height: 100dvh;
        }
      }

      @media (pointer: coarse) and (orientation: landscape) and (max-height: 520px) {
        .joystick {
          width: 122px;
          height: 122px;
        }

        .move-stick {
          left: max(28px, calc(env(safe-area-inset-left) + 22px));
          top: 28%;
        }

        .aim-stick {
          right: max(28px, calc(env(safe-area-inset-right) + 22px));
          top: 22%;
        }

        .joystick-knob {
          width: 46px;
          height: 46px;
        }

        .top-right-actions {
          right: max(18px, calc(env(safe-area-inset-right) + 12px));
          top: max(14px, calc(env(safe-area-inset-top) + 10px));
          gap: 10px;
        }

        .action-pad {
          right: max(28px, calc(env(safe-area-inset-right) + 20px));
          bottom: max(20px, calc(env(safe-area-inset-bottom) + 18px));
        }
      }

      @media (pointer: coarse) and (orientation: portrait) {
        .rotate-hint {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #050505;
          color: #ffcf33;
          text-align: center;
          font: 900 18px Arial, sans-serif;
          text-transform: uppercase;
        }
      }
    </style>
  </head>
  <body class="menu-mode">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading DOOM...</div>
    <div class="mobile-controls" aria-label="DOOM mobile controls">
      <div class="top-left-actions">
        <button type="button" class="game-action" data-control-mode="menu" data-doom-key="Escape" data-doom-code="Escape" data-doom-keycode="27" aria-label="Escape">ESC</button>
        <button type="button" class="game-action" data-doom-key="Tab" data-doom-code="Tab" data-doom-keycode="9" aria-label="Map">MAP</button>
        <button type="button" class="game-action weapon-action" data-weapon-cycle="true" aria-label="Cycle weapon">WEAP</button>
      </div>
      <div class="joystick move-stick" data-stick="move" aria-label="Move">
        <div class="joystick-knob"></div>
      </div>
      <div class="joystick aim-stick game-action" data-stick="aim" data-tap-fire="true" aria-label="Aim joystick. Tap to fire.">
        <div class="joystick-knob"></div>
      </div>
      <div class="menu-pad" aria-label="Menu navigation">
        <button type="button" data-menu-step="true" data-doom-key="ArrowUp" data-doom-code="ArrowUp" data-doom-keycode="38" aria-label="Menu up">&#8593;</button>
        <button type="button" class="menu-select" data-menu-select="true" data-doom-key="Enter" data-doom-code="Enter" data-doom-keycode="13">Enter</button>
        <button type="button" data-menu-step="true" data-doom-key="ArrowDown" data-doom-code="ArrowDown" data-doom-keycode="40" aria-label="Menu down">&#8595;</button>
      </div>
      <div class="top-right-actions">
        <button type="button" class="top-mobile-menu game-action" data-control-mode="menu" data-doom-key="Escape" data-doom-code="Escape" data-doom-keycode="27" aria-label="Menu">+</button>
        <button type="button" class="game-action open-action" data-doom-key="e" data-doom-code="KeyE" data-doom-keycode="69" aria-label="Open">OPEN</button>
        <button type="button" class="game-action run-action" data-doom-key="Shift" data-doom-code="ShiftLeft" data-doom-keycode="16" aria-label="Run">RUN</button>
      </div>
      <div class="move-dpad game-action" aria-label="Move buttons">
        <button type="button" class="dpad-up" data-doom-key="w" data-doom-code="KeyW" data-doom-keycode="87" aria-label="Move forward">&#8593;</button>
        <button type="button" class="dpad-left" data-doom-key="a" data-doom-code="KeyA" data-doom-keycode="65" aria-label="Strafe left">&#8592;</button>
        <button type="button" class="dpad-right" data-doom-key="d" data-doom-code="KeyD" data-doom-keycode="68" aria-label="Strafe right">&#8594;</button>
        <button type="button" class="dpad-down" data-doom-key="s" data-doom-code="KeyS" data-doom-keycode="83" aria-label="Move backward">&#8595;</button>
      </div>
      <div class="action-pad">
        <button type="button" class="primary-action game-action" data-doom-key=" " data-doom-code="Space" data-doom-keycode="32" aria-label="Fire"><span class="action-icon bullet-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="focus-menu" id="focus-menu">
      <div>
        <div>DOOM is paused</div>
        <button type="button" id="resume-game">Tap to resume</button>
      </div>
    </div>
    <div class="rotate-hint">Rotate your phone sideways for the best DOOM controls.</div>
    <script src="/games/doom/doom-loader.js?v=19"></script>
  </body>
</html>
