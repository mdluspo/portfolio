<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM II</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #050505;
        color: #ffcf33;
        font-family: Arial, sans-serif;
      }

      body {
        display: block;
      }

      #canvas {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: block;
        image-rendering: pixelated;
        outline: none;
        background: #000;
      }

      #status {
        display: none;
        min-height: 0;
        padding: 9px 12px;
        border-top: 2px solid #000;
        background: #2c2c2c;
        color: #ffcf33;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading DOOM...</div>
    <script src="/doom/doom-loader.js"></script>
  </body>
</html>
